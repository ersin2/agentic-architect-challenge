name: tests

on:
  push:
  pull_request:

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and type check
        run: |
          ruff check .
          mypy agentkit part1_support part2_scraper part3_agent --ignore-missing-imports
      - name: Install Chromium for the render tests
        run: python -m playwright install --with-deps chromium
      - name: Run the offline test suite (no API key, no internet needed)
        run: pytest
      - name: Load and chaos test (offline)
        run: python scripts/load_test_part1.py --emails 300 --workers 8 --failure-rate 0.2 --latency 0.01
